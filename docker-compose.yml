name: borderless-rails

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: borderless
      POSTGRES_PASSWORD: borderless
      POSTGRES_DB: borderless
    ports:
      - '${POSTGRES_HOST_PORT:-5434}:5432' # not 5432, to avoid clashing with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U borderless -d borderless']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: borderless
      RABBITMQ_DEFAULT_PASS: borderless
    ports:
      - '${RABBITMQ_HOST_PORT:-5672}:5672'
      - '${RABBITMQ_UI_HOST_PORT:-15672}:15672' # management UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  # The application: HTTP API plus, in the same process, the outbox relay that publishes
  # domain events to RabbitMQ and an example subscriber that logs them.
  api:
    build: .
    image: borderless-rails-api:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgres://borderless:borderless@postgres:5432/borderless
      RUN_MIGRATIONS: 'true'
      RABBITMQ_URL: amqp://borderless:borderless@rabbitmq:5672
      OUTBOX_RELAY_ENABLED: 'true'
      EVENTS_LOGGER_ENABLED: 'true'
    ports:
      - '${API_HOST_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
  rabbitmqdata:
