name: borderless-rails

x-app: &app
  build: .
  image: borderless-rails-api:local
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: borderless
      POSTGRES_PASSWORD: borderless
      POSTGRES_DB: borderless
    ports:
      - '${POSTGRES_HOST_PORT:-5434}:5432' # not 5432, to avoid clashing with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U borderless -d borderless']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: borderless
      RABBITMQ_DEFAULT_PASS: borderless
    ports:
      - '${RABBITMQ_HOST_PORT:-5672}:5672'
      - '${RABBITMQ_UI_HOST_PORT:-15672}:15672' # management UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  # HTTP API. Runs migrations on boot; writes domain events to the outbox only.
  api:
    <<: *app
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgres://borderless:borderless@postgres:5432/borderless
      RUN_MIGRATIONS: 'true'
    ports:
      - '${API_HOST_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy

  # Relays committed outbox events to the RabbitMQ topic exchange.
  worker:
    <<: *app
    command: ['node', 'dist/worker.js']
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgres://borderless:borderless@postgres:5432/borderless
      RUN_MIGRATIONS: 'false' # the api owns migrations
      RABBITMQ_URL: amqp://borderless:borderless@rabbitmq:5672
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Example subscriber other teams can copy: binds its own queue to every event and logs it.
  events-logger:
    <<: *app
    command: ['node', 'dist/consumer.js']
    environment:
      RABBITMQ_URL: amqp://borderless:borderless@rabbitmq:5672
      CONSUMER_QUEUE: borderless.events-logger
      CONSUMER_BINDING: '#'
    healthcheck:
      disable: true
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
  rabbitmqdata:
