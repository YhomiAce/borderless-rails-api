name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --immutable # uses the vendored Yarn release (.yarnrc.yml yarnPath)

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      # Testcontainers starts Postgres and RabbitMQ using the runner's Docker.
      - name: Test
        run: yarn test

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t borderless-rails-api:ci .
